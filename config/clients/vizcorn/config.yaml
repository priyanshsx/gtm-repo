client: vizcorn
display_name: vizcorn
template: b2b 

# Confirm
language: [en]

offer: > 
  Fixed-price master data quality assessment for tier 2 suppliers, using Vizcorn's own data quality tool, followed by cleanup and governance support. ERP-agnostic.
  
positioning: >
  Master data and data quality specialists for tier 2 suppliers in automotive, FMCG, CPG and automation. Local presence in th EU and US, delivery backed by an experienced team in India. 

segments:
  - name: supplier 
    description: Tier 2 suppliers to larger enterprises
    priority: 1
    industries: {automotive: 30, fmcg: 25, cpg: 25, industrial_automation: 25}
    priority: 1
    company_size: {min: 50, max: 2000, points: 20}
    titles:
      - {match: ["head of it", "it director", "it manager", "cio"], points: 30, persona: partner_exec}
      - {match: ["practice lead", "delivery", "head of consulting"], points: 25, persona: delivery_lead}
      - {match: ["alliances", "partnerships", "channel"], points: 25, persona: alliances}
    exclude_titles: ["student", "intern", "recruiter"]

signals:
  customer_data_requirement: 40
  erp_migration: 40
  new_major_customer: 30
  acquisition_or_merger: 30
  job_post_data_role: 35
  job_post_erp_project: 30
  audit_or_certification: 15
  engaged_own_post_comment: 25
  engaged_own_post_reaction: 10
  posted_about_topic: 20
  engaged_creator_post: 5

listening: 
  topics:
    - name: master_data_quality
    keywords: ["master data", "data quality", "MDM", "material master", "product data quality"]
    - name: supplier_data_requirements 
    keywords: ["supplier data requirements", "supplier portal", "product data compliance", "traceability data"]
    - name: fmcg_cpg
    keywords: ["product data", "product information management", "pim", "item data synchronization with retailers"]
    - name: erp_migration
    keywords: ["ERP migration", "S/4HANA migration", "Dynamics migration", "data migration"]
    rss_feeds: []
    subreddits: ["SAP", "ERP", "supplychain"]
    job_keywords: ["master data", "data quality", "MDM", "ERP project"]

content: 
  pillars:
    - {name: supplier_data_pressure, description: "What large customers now demand from suppliers' data, and how to cope"}
    - {name: data_quality_practice, description: "Practical master data fixes and governance"}   
    - {name: erp_migration_data, description: "Why migrations fail on data, and how to prevent it"} 
    - {name: building_vizcorn, description: "Building a data quality firm across EU, US and India"}

