[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-engine"
version = "0.1.0"
requires-python = ">3.11"
dependencies = [
    "python-dotenv",
    "pyyaml",
    "pydantic",
    "httpx",
    "anthropic"
]

[tool.setuptools.packages.find]
include = ["gtm*"]